<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Chord Expert</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/bootstrap-toggle.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script>
        // The app sets the theme once it renders (Layout/MainLayout.razor); until then guess it from the
        // colour scheme the web view reports, which the native app sets from the theme setting.
        if (window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches) {
            document.documentElement.classList.add("theme-dark");
        }
        window.chordsTheme = {
            set: dark => document.documentElement.classList.toggle("theme-dark", dark)
        };
    </script>
</head>
<body>
    <div id="app"></div>
    <script src="js/tuner.js"></script>
    <script src="js/strum.js"></script>
    <script src="js/metronome.js"></script>
    <script src="js/autofit.js"></script>
    <script src="_framework/blazor.webview.js" autostart="false"></script>
</body>
</html>
